name: Refresh Google Scholar citations

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
      - name: Refresh the saved Scholar snapshot
        run: bundle exec ruby bin/update_scholar.rb
      - name: Commit the snapshot and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/citations.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/citations.json
          git commit -m 'Refresh Google Scholar citation counts'
          git push origin HEAD:master
          gh workflow run deploy.yml --ref master
